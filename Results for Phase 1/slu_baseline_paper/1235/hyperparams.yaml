# Seed needs to be set at top of yaml, before objects with parameters are made
seed: 1235
__set_seed: !apply:torch.manual_seed [1235]
output_folder: results/slu_baseline_paper/1235
save_folder: results/slu_baseline_paper/1235/save
train_log: results/slu_baseline_paper/1235/train_log.txt

# Data files
file_name: metadata/stealthyIMU_all_relative.csv
data_folder: StealthyIMU_dataset/
train_splits: [train_synthetic, train_real]
csv_train: results/slu_baseline_paper/1235/train-type=direct.csv
csv_valid: results/slu_baseline_paper/1235/valid-type=direct.csv
csv_test: results/slu_baseline_paper/1235/test-type=direct.csv
tokenizer_file: pretrain/51_unigram.model
skip_prep: false

# Training parameters
number_of_epochs: 30
batch_size: 8
lr: 0.0003
token_type: unigram # ["unigram", "bpe", "char"]
sorting: random
ckpt_interval_minutes: 15 # save checkpoint every N min

# Model parameters
sample_rate: 500
n_fft: 80
n_win_length: 80
n_hop_length: 20
n_feature: 31
emb_size: 64
dec_neurons: 256
output_neurons: 51 # index(eos/bos) = 0
ASR_encoder_dim: 256

# Encoding parameters
activation: &id001 !name:torch.nn.LeakyReLU
dropout: 0.15
cnn_blocks: 1
cnn_channels: &id002 (64, 128)
inter_layer_pooling_size: &id004 (2, 2)
cnn_kernelsize: &id003 (3, 3)
time_pooling_size: 2
rnn_class: &id005 !name:speechbrain.nnet.RNN.LSTM
rnn_layers: 4
rnn_neurons: 256
rnn_bidirectional: true
dnn_blocks: 2
dnn_neurons: 256

# Decoding parameters
bos_index: 0
eos_index: 0
min_decode_ratio: 0.0
max_decode_ratio: 10.0
slu_beam_size: 80
eos_threshold: 1.5
temperature: 1.25

dataloader_opts:
  batch_size: 8
  shuffle: true

epoch_counter: &id014 !new:speechbrain.utils.epoch_loop.EpochCounter

  limit: 30

normalize: !new:speechbrain.processing.features.InputNormalization
  norm_type: global

compute_features: !new:feature.AccSpec
  sample_rate: 500
  win_length: 80
  hop_length: 20
  n_fft: 80

enc: &id006 !new:speechbrain.lobes.models.CRDNN.CRDNN
  input_shape: [null, null, 31]
  activation: *id001
  dropout: 0.15
  cnn_blocks: 1
  cnn_channels: *id002
  cnn_kernelsize: *id003
  inter_layer_pooling_size: *id004
  time_pooling: true
  using_2d_pooling: false
  time_pooling_size: 2
  rnn_class: *id005
  rnn_layers: 4
  rnn_neurons: 256
  rnn_bidirectional: true
  rnn_re_init: true
  dnn_blocks: 2
  dnn_neurons: 256

output_emb: &id007 !new:speechbrain.nnet.embedding.Embedding
  num_embeddings: 51
  embedding_dim: 64

dec: &id008 !new:speechbrain.nnet.RNN.AttentionalRNNDecoder
  enc_dim: 256
  input_size: 64
  rnn_type: gru
  attn_type: keyvalue
  hidden_size: 256
  attn_dim: 256
  num_layers: 3
  scaling: 1.0
  dropout: 0.0

seq_lin: &id009 !new:speechbrain.nnet.linear.Linear
  input_size: 256
  n_neurons: 51

env_corrupt: &id010 !new:speechbrain.lobes.augment.EnvCorrupt

  babble_prob: 0.0
  reverb_prob: 0.0
  noise_prob: 1.0
  noise_snr_low: 0
  noise_snr_high: 15

modules:
  enc: *id006
  output_emb: *id007
  dec: *id008
  seq_lin: *id009
  env_corrupt: *id010
model: &id012 !new:torch.nn.ModuleList
- [*id006, *id007, *id008, *id009]
tokenizer: &id011 !new:sentencepiece.SentencePieceProcessor

pretrainer: !new:speechbrain.utils.parameter_transfer.Pretrainer
  collect_in: results/slu_baseline_paper/1235/save/SLURM_tokenizer
  loadables:
    tokenizer: *id011
  paths:
    tokenizer: pretrain/51_unigram.model

beam_searcher: !new:speechbrain.decoders.S2SRNNBeamSearcher
  embedding: *id007
  decoder: *id008
  linear: *id009
  bos_index: 0
  eos_index: 0
  min_decode_ratio: 0.0
  max_decode_ratio: 10.0
  beam_size: 80
  eos_threshold: 1.5
  temperature: 1.25
  using_max_attn_shift: false
  max_attn_shift: 30
  coverage_penalty: 0.

opt_class: !name:torch.optim.Adam
  lr: 0.0003

lr_annealing: &id013 !new:speechbrain.nnet.schedulers.NewBobScheduler
  initial_value: 0.0003
  improvement_threshold: 0.0025
  annealing_factor: 0.8
  patient: 0

checkpointer: !new:speechbrain.utils.checkpoints.Checkpointer
  checkpoints_dir: results/slu_baseline_paper/1235/save
  recoverables:
    model: *id012
    scheduler: *id013
    counter: *id014
log_softmax: !new:speechbrain.nnet.activations.Softmax
  apply_log: true

seq_cost: !name:speechbrain.nnet.losses.nll_loss
  label_smoothing: 0.1

train_logger: !new:speechbrain.utils.train_logger.FileTrainLogger
  save_file: results/slu_baseline_paper/1235/train_log.txt

error_rate_computer: !name:speechbrain.utils.metric_stats.ErrorRateStats

cer_computer: !name:speechbrain.utils.metric_stats.ErrorRateStats
  split_tokens: true
